name: Publish firmware manifest

# The console reads manifest.json from raw.githubusercontent.com on every
# visit to its flash page, so the manifest must always describe what is
# actually committed. Rebuilding it here rather than by hand is what keeps
# the two from drifting — a manifest promising a binary that is not there
# fails in a technician's browser, not in CI.
on:
  push:
    branches: ['main']
    paths:
      - 'builds/**'
      - '.github/workflows/manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assemble manifest from builds/
        run: python3 scripts/build-manifest.py

      - name: Commit if it changed
        run: |
          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m 'Rebuild firmware manifest'
          git push
