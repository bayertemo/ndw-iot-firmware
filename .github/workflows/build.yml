name: Build firmware

# Builds the firmware and publishes the manifest the console reads. Both live
# here rather than in two workflows: they fire on the same paths and write the
# same file, so as separate workflows they raced to commit manifest.json.
#
# What differs is what a build is called and whether it is committed:
#
#   main          → x.y.z            committed, and the console offers it
#   anywhere else → x.y.z-rc.<n>+sha built and attached to the run, never
#                                    committed
#
# The -rc suffix is not cosmetic. The console reads one manifest and offers
# whatever is in it, so an unreviewed build reaching main is a build a
# technician can flash onto real hardware. A release candidate has to be
# nameable and testable without being publishable, and the version string is
# what carries that distinction into the field — a board reports its own
# revision, and "0.1.0" on a bench that was flashed from a PR is a lie nobody
# can detect later.
on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'builds/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'builds/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Publishing runs commit to main, so two overlapping ones would race on the
# same ref. Serialised per branch — and deliberately without
# cancel-in-progress: a run that is part-way through pushing a build should
# finish, not be killed leaving the manifest describing binaries that were
# never committed.
#
# This does not remove the need for the rebase in the publish step: the jobs
# within one run are a matrix and still push in parallel.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The core on the host (src/host-tests): the LoRaWAN stack against an
  # independent implementation's frames, and the fleet and gateway engines
  # against fakes, before any board is built with them.
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        working-directory: src/host-tests
        run: |
          set -euo pipefail
          pip install --quiet -r requirements.txt
          pio test -e native

  # The boards: each a PlatformIO project picking the core, a hardware layer
  # and a radio. A release only from main, -rc everywhere else, offsets
  # checked against what the toolchain itself would flash, and a
  # rebase-and-push publish.
  build-platformio:
    needs: test-native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: boards/heltec-wifi-lora-32-v3/lora-fleet
            env: heltec_v3
            build: ndw/heltec/wifi-lora-32-v3/lora/probe
            artifact: probe
          - project: boards/heltec-wifi-lora-32-v3/lora-gateway
            env: heltec_v3
            build: ndw/heltec/wifi-lora-32-v3/lora/gateway
            artifact: gateway
          - project: boards/esp32-c3/ble-gateway
            env: esp32c3
            build: ndw/espressif/esp32/c3/bl/lorawan-gateway
            artifact: ble-gateway
          - project: boards/esp32-c3/ble-fleet
            env: esp32c3
            build: ndw/espressif/esp32/c3/bl/lorawan-fleet
            artifact: ble-fleet

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          base=$(python3 -c "import json;print(json.load(open('builds/${{ matrix.build }}/build.json')).get('revision','0.0.0'))")
          sha=$(git rev-parse --short HEAD)
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            version="${base}"
            publish=true
          else
            version="${base}-rc.${{ github.run_number }}+${sha}"
            publish=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          # For every step, not only the build. platformio.ini interpolates
          # it into the build flags, and PlatformIO wipes the build directory
          # whenever its configuration changes — so a later `pio project
          # metadata` run without it deleted the images it was asked about.
          echo "NDW_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Building ${{ matrix.build }} as ${version}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO's platforms and libraries
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles(format('src/{0}/platformio.ini', matrix.project)) }}

      - name: Build
        working-directory: src/${{ matrix.project }}
        # NDW_VERSION comes from the job environment, set above.
        run: |
          set -euo pipefail
          # Pinned in requirements.txt: a toolchain that
          # moves on its own turns an unrelated push into a different binary.
          pip install --quiet -r requirements.txt
          pio run -e ${{ matrix.env }}

      - name: Collect the images
        working-directory: src/${{ matrix.project }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/builds/${{ matrix.build }}"
          build=".pio/build/${{ matrix.env }}"
          # boot_app0 is the Arduino core's otadata image, fetched with the
          # platform rather than built, so it is found where PlatformIO says.
          boot_app0=$(pio project metadata -e ${{ matrix.env }} --json-output \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['${{ matrix.env }}']; print(next(f['path'] for f in d['extra']['flash_images'] if f['path'].endswith('boot_app0.bin')))")
          cp "$build/bootloader.bin" "$out/bootloader.bin"
          cp "$build/partitions.bin" "$out/partition-table.bin"
          cp "$boot_app0" "$out/boot-app0.bin"
          cp "$build/firmware.bin" "$out/app.bin"
          ls -l "$out"/*.bin

      - name: Check the offsets against what PlatformIO would use
        working-directory: src/${{ matrix.project }}
        run: |
          set -euo pipefail
          # A declared offset that disagrees with the toolchain's writes happily and
          # leaves a board that never boots.
          pio project metadata -e ${{ matrix.env }} --json-output > /tmp/metadata.json
          python3 - <<'PY'
          import json, os, pathlib, sys

          env = "${{ matrix.env }}"
          meta = json.load(open("/tmp/metadata.json"))[env]["extra"]
          truth = {pathlib.Path(f["path"]).name: int(f["offset"], 16) for f in meta["flash_images"]}
          truth["firmware.bin"] = int(meta["application_offset"], 16)

          copied = {
              "bootloader.bin": "bootloader.bin",
              "partition-table.bin": "partitions.bin",
              "boot-app0.bin": "boot_app0.bin",
              "app.bin": "firmware.bin",
          }
          build = json.loads(pathlib.Path(os.environ["GITHUB_WORKSPACE"], "builds/${{ matrix.build }}/build.json").read_text())
          declared = {p["path"]: p["address"] for p in build["parts"]}

          bad = False
          for name, source in copied.items():
              want, got = truth.get(source), declared.get(name)
              if want is None:
                  print(f"error: PlatformIO does not flash {source}")
                  bad = True
              elif got != want:
                  print(f"error: {name} declared at {got:#x}, PlatformIO uses {want:#x}")
                  bad = True
              else:
                  print(f"ok: {name} at {got:#x}")
          extra = set(truth) - set(copied.values())
          if extra:
              print(f"error: PlatformIO flashes images the manifest omits: {sorted(extra)}")
              bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Record the version in the build definition
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("builds/${{ matrix.build }}/build.json")
          doc = json.loads(p.read_text())
          doc["revision"] = os.environ["VERSION"]
          p.write_text(json.dumps(doc, indent=2) + "\n")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Rebuild the manifest
        run: python3 scripts/build-manifest.py

      - name: Attach the build to this run
        uses: actions/upload-artifact@v4
        with:
          # One name a row: upload-artifact refuses a name already taken in the run.
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.version }}
          path: |
            builds/${{ matrix.build }}/*.bin
            manifest.json
          retention-days: 14

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard builds)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add builds manifest.json
          git commit -m "Publish ${{ matrix.build }} ${{ steps.version.outputs.version }}"
          # Other jobs push in parallel; rebase onto them and regenerate the
          # manifest rather than merging it.
          git fetch origin main
          if ! git rebase origin/main; then
            git checkout --theirs manifest.json 2>/dev/null || true
            python3 scripts/build-manifest.py
            git add manifest.json
            GIT_EDITOR=true git rebase --continue
          fi
          python3 scripts/build-manifest.py
          if ! git diff --quiet manifest.json; then
            git add manifest.json
            git commit --amend --no-edit
          fi
          git push

      - name: Say what was built
        if: steps.version.outputs.publish != 'true'
        run: |
          {
            echo "### ${{ matrix.build }}"
            echo
            echo "Built \`${{ steps.version.outputs.version }}\` — **not published**."
            echo
            echo "Download it from this run's artifacts to flash a bench board."
          } >> "$GITHUB_STEP_SUMMARY"
