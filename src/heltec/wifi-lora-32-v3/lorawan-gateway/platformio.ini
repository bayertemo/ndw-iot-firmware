; The NDW LoRaWAN Gateway for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262): a
; single-channel LoRaWAN gateway speaking LoRa Basics Station to MeterFax.
;
; Built by the workflow into builds/ndw/heltec/wifi-lora-32-v3/lora/gateway
; and flashed from the browser. One image for every board: its WiFi, server,
; trust file and token arrive over USB after flashing.
;
; Pinned throughout, as the fleet firmware beside it is, so an unrelated push
; cannot become a different binary.
[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    ; Set by the workflow to the release or -rc version; empty for a local
    ; build, which the firmware reports as "dev".
    '-DGATEWAY_VERSION="${sysenv.NDW_VERSION}"'
lib_deps =
    jgromes/RadioLib@7.1.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
    bblanchon/ArduinoJson@7.2.1
    links2004/WebSockets@2.6.1
