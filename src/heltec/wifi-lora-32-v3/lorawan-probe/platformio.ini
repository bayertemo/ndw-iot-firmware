; The NDW LoRaWAN probe for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262).
;
; Built by the workflow into builds/ndw/heltec/wifi-lora-32-v3/lora/probe and
; flashed from the browser. One image for every board: nothing about a device
; is compiled in — its keys arrive over USB after flashing.
;
; Everything is pinned, for the reason the ESP-IDF builds pin their image: a
; toolchain or library that moves on its own turns an unrelated push into a
; different binary.
[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Adds the "fleet" NVS partition the meter fleet is stored in; see the file.
board_build.partitions = partitions.csv
build_flags =
    ; The workflow sets NDW_VERSION to the release or -rc version, so a board
    ; says which build it runs when asked. Empty for a local build, which the
    ; firmware reports as "dev".
    '-DPROBE_VERSION="${sysenv.NDW_VERSION}"'
lib_deps =
    jgromes/RadioLib@7.1.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
    bblanchon/ArduinoJson@7.2.1
