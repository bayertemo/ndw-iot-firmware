; NDW BLE Gateway, for an ESP32-C3: hears LoRaWAN frames that NDW BLE meters
; advertise over Bluetooth, and forwards them to MeterFax as a LoRa Basics
; Station over WiFi.
;
; Built by the workflow into builds/ndw/espressif/esp32/c3/bl/lorawan-gateway
; and flashed from the browser. One image for every board: its WiFi, server,
; trust file and token arrive over USB after flashing, as the Heltec
; gateway's do.
;
; Pinned throughout, as the Heltec builds are.
[env:esp32c3]
platform = espressif32@6.9.0
; Any ESP32-C3 with 4MB of flash: the SuperMini, a DevKitM, a XIAO.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    ; The C3's own USB is the serial port the host programs it over.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE with BLE 5 extended advertising, which NDW's BLE radio needs:
    ; a join accept and a downlink with MAC commands outgrow a legacy one.
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    ; Set by the workflow to the release or -rc version; empty for a local
    ; build, which the firmware reports as "dev".
    '-DGATEWAY_VERSION="${sysenv.NDW_VERSION}"'
; The layers: the core, the ESP32's hardware, and the BLE radio.
lib_extra_dirs =
    ../../../core
    ../../../hal
    ../../../radio
lib_deps =
    ndw-station
    ndw-hal-esp32
    ndw-hal-esp32-net
    ndw-radio-ble
    jgromes/RadioLib@7.1.2
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1
    links2004/WebSockets@2.6.1
