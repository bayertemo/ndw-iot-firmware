; NDW BLE meter fleet, for an ESP32-C3: simulated water, electricity and gas
; meters, each a LoRaWAN Class A device joining by OTAA, whose frames go over
; BLE advertising to an NDW BLE Gateway nearby.
;
; Built by the workflow into builds/ndw/espressif/esp32/c3/bl/lorawan-fleet
; and flashed from the browser. Nothing about a device is compiled in: the
; fleet's keys arrive over USB after flashing.
;
; Pinned throughout, as the Heltec builds are.
[env:esp32c3]
platform = espressif32@6.9.0
; Any ESP32-C3 with 4MB of flash: the SuperMini, a DevKitM, a XIAO. Nothing
; here uses a pin.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Adds the "fleet" NVS partition the meter fleet is stored in; see the file.
board_build.partitions = partitions.csv
build_flags =
    ; The C3's own USB is the serial port the host programs it over.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE with BLE 5 extended advertising, which NDW's BLE radio needs:
    ; a join accept and a downlink with MAC commands outgrow a legacy one.
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    ; Set by the workflow to the release or -rc version; empty for a local
    ; build, which the firmware reports as "dev".
    '-DFLEET_VERSION="${sysenv.NDW_VERSION}"'
; The layers: the core, the ESP32's hardware, and the BLE radio.
lib_extra_dirs =
    ../../../core
    ../../../hal
    ../../../radio
lib_deps =
    ndw-fleet
    ndw-hal-esp32
    ndw-radio-ble
    jgromes/RadioLib@7.1.2
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.2.1
