; The core on the host: everything under src/core, which names no hardware
; and no radio, built for this machine and tested against independent
; implementations and fakes. `pio test` here; CI runs it before any board
; is built.
;
;   test_lorawan   uplink frames against lora-packet's
;   test_classa    join, session keys, downlinks, MAC commands, against lora-packet's
;   test_meters    the payloads the NDW Simulator codec reads, and registers that only rise
;   test_fleet     the fleet engine against a fake radio and a fake network server
;   test_station   the gateway core through Basics Station against a fake network stack
[env:native]
platform = native
build_flags = -std=c++17
lib_extra_dirs = ../core
lib_deps =
    jgromes/RadioLib@7.1.2
    bblanchon/ArduinoJson@7.2.1
    ndw-hal
    ndw-radio
    ndw-lorawan
    ndw-meters
    ndw-fleet
    ndw-station
