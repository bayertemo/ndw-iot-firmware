; A LoRaWAN test device on a Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262),
; for proving the WisGate hears sub-band 2 and the path to MeterFax works.
[env:heltec_v3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^7.1.2
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
